[build-system]
# setuptools is not a runtime dep, but pip pulls it in transitively during
# editable installs. Pin to clear PYSEC-2022-43012, PYSEC-2025-49 and
# CVE-2024-6345 in setuptools' package_index / URL-fetching code paths
# (>=78.1.1, docs/SECURITY_AUDIT_2026-05.md), and PYSEC-2026-3447
# (>=83.0.0), which CI's pip-audit began failing on once 79.0.1 resolved.
requires = ["hatchling", "setuptools>=83.0.0"]
build-backend = "hatchling.build"

[project]
name = "goetta-finance"
version = "0.1.0"
description = "Local-first MCP server that connects SimpleFIN to Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Griffin Goepper" }]
keywords = ["simplefin", "mcp", "personal-finance", "duckdb", "claude", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "duckdb>=0.10",
    "typer>=0.12",
    # Ceiling is load-bearing, not caution: mcp 2.0 removed
    # `mcp.server.fastmcp`, which server.py, daemon.py and web/app.py all
    # import, so an unpinned resolve gives an install that fails at
    # import — which is exactly what took CI red across every open PR.
    # Lifting it is a port to the 2.x API (FastMCP became MCPServer), not
    # a version bump. The floor clears PYSEC-2026-3481/3482/3483; 3482
    # matters here — the SSE and streamable-HTTP transports routed a
    # request to an existing session on session id alone, without
    # checking the same principal created it, and that is the transport
    # served at /api/mcp.
    "mcp>=1.28.1,<2",
    "fastapi>=0.115",
    # Transitive via fastapi, floored directly (same pattern as the
    # setuptools build-system pin): starlette <1.1.0 lets StaticFiles on
    # Windows be walked to a UNC path, so os.path.realpath opens an
    # outbound SMB connection and leaks NTLMv2 credentials before the
    # path is rejected (PYSEC-2026-2281). We mount StaticFiles at
    # /static and, with --dash-dir, at /dash.
    "starlette>=1.1.0",
    "uvicorn>=0.30",
    "jinja2>=3",
    "plotly>=5",
]

[project.urls]
Homepage = "https://github.com/griffin-goepper/goetta-finance-mcp"
Repository = "https://github.com/griffin-goepper/goetta-finance-mcp"
Issues = "https://github.com/griffin-goepper/goetta-finance-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Not a build dep here — that is [build-system].requires, which only
    # provisions the isolated build environment and never reaches the
    # venv `pip install -e ".[dev]"` creates. pip-audit scans that venv,
    # where setuptools arrives from actions/setup-python, so the floor
    # has to be declared here too or the advisory is simply never fixed.
    # PYSEC-2026-3447 needs >=83.0.0.
    "setuptools>=83.0.0",
]

[project.scripts]
goetta-finance = "goetta_finance.cli:app"

[tool.hatch.build.targets.wheel]
# ``packages`` already ships every file under src/goetta_finance, including
# the .sql migration files and the bundled web assets (templates, static).
# A previous ``force-include`` of the migrations re-added them at the same
# wheel path and broke ``python -m build`` with a duplicate-path error
# (hatchling rejects two files at one archive path). The package include
# is sufficient on its own — verified by inspecting the built wheel's
# contents (see the build-verification step in the license/packaging slice).
packages = ["src/goetta_finance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests exercise adversarial inputs by design. Each ignore was audited
# in docs/SECURITY_AUDIT_2026-05.md before being added — do not append
# new entries here without writing the rationale into the audit doc.
#   S101 — `assert` in tests is the entire point of pytest.
#   S105 — test fixtures intentionally use sentinel "secret"-named strings
#          to prove the read_csv exfil block in query_sql works.
#   S608 — test helpers and regression tests construct f-string SQL on
#          purpose (the goal is to exercise the security boundary, not
#          to launder user input).
"tests/**" = ["S101", "S105", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/goetta_finance"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
# Scan only the library source; the test tree intentionally exercises
# adversarial inputs and would generate noise. Don't add new exclusions
# here without first reading docs/SECURITY_AUDIT_2026-05.md and treating
# the underlying finding properly.
exclude_dirs = ["tests", ".venv"]
